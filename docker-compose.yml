# Deploy on Dokploy as a Compose-type application pointing at the GHCR image the pipeline
# pushes. The service MUST join `dokploy-network`: Dokploy's Traefik only discovers containers
# on that network, and a container outside it gets no router at all — which Traefik answers as
# a 404 on every path, not a 502, so it reads like a broken app rather than missing routing.
#
# Labels are still injected by Dokploy's Domains tab (service `app`, port 8080) — but they only
# take effect once the container is on the network above.
#
# For local use: `docker build -t blitz-task:local . && docker compose up`, after
# `docker network create dokploy-network` (or just `docker run` the image directly).
services:
  app:
    image: ghcr.io/linknexus/blitz-task:latest
    restart: unless-stopped
    networks:
      - dokploy-network
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      # Production mail goes through Resend (Development uses local SMTP instead).
      # All three are required: with no From address the Resend API rejects every send, and
      # because the EmailConfirmed policy gates almost every endpoint, a new account can never
      # be confirmed — the app looks broken rather than the mail looking broken.
      # `__` is ASP.NET's separator for nested config, so these bind to the "Resend" section.
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY must be set}
      Resend__FromEmail: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL must be set (a domain verified in Resend)}
      Resend__FromName: ${RESEND_FROM_NAME:-BlitzTask}
    volumes:
      # Both paths are relative in appsettings.json and resolve against WORKDIR=/app.
      # Without these, every redeploy discards the database and all uploaded attachments.
      - blitz-data:/app/Data
      - blitz-uploads:/app/Uploads
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  dokploy-network:
    external: true

volumes:
  blitz-data:
  blitz-uploads:
